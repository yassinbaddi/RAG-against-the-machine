[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fire>=0.6",
    "bm25s>=0.2",
    "tqdm>=4.66",
    "pydantic>=2.6",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.40",
    "langchain-text-splitters>=0.2",
    "sentence-transformers>=3.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]
