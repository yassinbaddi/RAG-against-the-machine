[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "bm25s>=0.3.10",
    "tqdm>=4.70.0",
    "pydantic>=2.13.4",
    "numpy>=2.5.2",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "langchain-text-splitters>=1.1.3",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]
